server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HTML — always revalidate
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Static assets under /assets — filenames are NOT content-hashed
    # (stores.js, logo.png, photos/*), so they must revalidate or an
    # update would be invisible to returning visitors. no-cache =
    # browser caches but always revalidates; nginx answers 304 when
    # unchanged, so it stays fast without ever going stale.
    location /assets/ {
        access_log off;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Health endpoint
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Clean store URLs — /victoria, /osoyoos, etc. serve store.html.
    # store.html reads the city from the path.
    location ~ ^/(victoria|osoyoos|princeton|peachland|sidney)/?$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /store.html =404;
    }

    # Fallback to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version
    server_tokens off;
}
