services:
  web:
    build: .
    image: vape-shack:latest
    container_name: vape-shack
    restart: unless-stopped
    # Internal-only — Caddy reaches it via the docker network on `web:80`.
    # If you ever need to bypass Caddy locally, add:  ports: ["8080:80"]
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: vape-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    environment:
      # Override at deploy time:  SITE_HOST=vapeshack.ca docker compose up -d
      SITE_HOST: ${SITE_HOST:-srv844822.hstgr.cloud}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # Let's Encrypt certs persist here
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
